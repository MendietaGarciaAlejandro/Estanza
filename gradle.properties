org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

android.useAndroidX=true
android.nonTransitiveRClass=true

# Desde AGP 9 el plugin 'com.android.application' se pelea con el de Kotlin Multiplatform
# en el mismo modulo: AGP trae ahora su propio soporte de Kotlin y los dos quieren
# configurar lo mismo. La alternativa que recomienda Google es partir el proyecto en dos
# modulos (una libreria KMP y una aplicacion Android que la use), pero para una aplicacion
# que ademas corre en escritorio y en el navegador eso es mucho andamiaje por muy poco.
# Estas dos propiedades apagan el Kotlin integrado de AGP y dejan que mande el de KMP.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
